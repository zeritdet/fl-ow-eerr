<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Gent Flowers — Admin</title><link rel="stylesheet" href="./css/admin.css"></head>
<body><main class="admin-shell"><header><div class="brand">GENT <span>FLOWERS</span></div><p>PANEL ZAMÓWIEŃ</p></header>
<section id="login" class="panel login"><h1>Logowanie</h1><form id="login-form"><label>Login<input name="username" autocomplete="username" required value="gentflower!"></label><label>Hasło<input name="password" type="password" autocomplete="current-password" required></label><button>Zaloguj się</button><p id="login-error" class="error"></p></form></section>
<section id="dashboard" hidden><div class="toolbar"><div><h1>Zamówienia</h1><p id="count">Historia zamówień</p></div><button id="logout" class="secondary">Wyloguj</button></div><div id="notice" role="status"></div><div class="filters"><button data-filter="ALL" class="active">Wszystkie</button><button data-filter="NEW">Nowe</button><button data-filter="IN_PROGRESS">W realizacji</button><button data-filter="COMPLETED">Zakończone</button></div><div id="orders" class="orders"></div></section></main><script src="./js/admin.js"></script></body></html>
