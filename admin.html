<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Gent Flowers — Admin</title><link rel="stylesheet" href="./css/admin.css"><script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" defer></script></head>
<body><main class="admin-shell"><header><div class="brand">GENT <span>FLOWERS</span></div><p>ПАНЕЛЬ ЗАКАЗОВ</p></header>
<section id="login" class="panel login"><h1>Вход в панель</h1><form id="login-form" autocomplete="off"><label>Логин<input name="username" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" readonly onfocus="this.removeAttribute('readonly')" required></label><label>Пароль<input name="password" type="password" autocomplete="new-password" required></label><div id="adminTurnstile"></div><button>Войти</button><p id="login-error" class="error"></p></form></section>
<section id="dashboard" hidden><div class="toolbar"><div><h1>Заказы</h1><p id="count">История заказов</p></div><div class="toolbar-actions"><button id="refresh" class="secondary">Обновить</button><button id="logout" class="secondary">Выйти</button></div></div><div id="notice" role="status"></div>
<div class="stats-grid" id="statsGrid" aria-label="Статистика магазина"></div>
<section class="panel catalog-admin"><div class="catalog-admin-head"><div><h2>Товары магазина</h2><p>Каталог редактируется через Pages CMS — это сохраняет текущую публикацию сайта.</p></div><a class="cms-link" href="https://app.pagescms.org/" target="_blank" rel="noopener">Управлять товарами ↗</a></div><div id="adminProducts" class="admin-products"><p class="muted">Загрузка каталога…</p></div></section>
<div class="filters"><button data-filter="ALL" class="active">Все</button><button data-filter="NEW">Новые</button><button data-filter="IN_PROGRESS">В работе</button><button data-filter="COMPLETED">Завершённые</button></div><div id="orders" class="orders"></div></section></main><script src="./js/admin.js"></script></body></html>
