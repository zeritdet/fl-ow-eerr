media:
  input: media
  output: /media
  extensions: [jpg, jpeg, png, webp, gif, svg]

content:
  - name: site
    label: Gent Flowers — treść strony
    type: file
    path: data/site.json
    format: json
    fields:
      - name: brand
        label: Marka i logo
        type: object
        fields:
          - name: name
            label: Nazwa marki
            type: string
          - name: logo
            label: Logo
            type: image
      - name: theme
        label: Kolory strony
        type: object
        fields:
          - name: page_background
            label: Tło strony (HEX)
            type: string
          - name: ink
            label: Główny kolor tekstu (HEX)
            type: string
          - name: muted
            label: Kolor tekstu pomocniczego (HEX)
            type: string
          - name: hero_background
            label: Tło głównego ekranu (HEX)
            type: string
          - name: green
            label: Kolor dodatkowy (HEX)
            type: string
          - name: accent
            label: Kolor akcentowy (HEX)
            type: string
          - name: line
            label: Kolor obramowań (HEX)
            type: string
      - name: texts
        label: Teksty interfejsu — PL / EN
        type: object
        fields:
          - name: delivery
            label: Pasek dostawy
            type: object
            fields:
              - { name: pl, label: Polski, type: string }
              - { name: en, label: English, type: string }
          - name: contact
            label: Kontakt
            type: object
            fields:
              - { name: pl, label: Polski, type: string }
              - { name: en, label: English, type: string }
          - name: studio
            label: Podpis pracowni
            type: object
            fields:
              - { name: pl, label: Polski, type: string }
              - { name: en, label: English, type: string }
          - name: heroTitle
            label: Nagłówek główny
            type: object
            fields:
              - { name: pl, label: Polski, type: string }
              - { name: en, label: English, type: string }
          - name: heroText
            label: Opis główny
            type: object
            fields:
              - { name: pl, label: Polski, type: text }
              - { name: en, label: English, type: text }
          - name: heroNote
            label: Notatka na zdjęciu
            type: object
            fields:
              - { name: pl, label: Polski, type: string }
              - { name: en, label: English, type: string }
          - name: findOccasion
            label: Podpis sekcji kolekcji
            type: object
            fields:
              - { name: pl, label: Polski, type: string }
              - { name: en, label: English, type: string }
          - name: collectionsTitle
            label: Nagłówek kolekcji
            type: object
            fields:
              - { name: pl, label: Polski, type: string }
              - { name: en, label: English, type: string }
          - name: collectionIntro
            label: Opis kolekcji
            type: object
            fields:
              - { name: pl, label: Polski, type: string }
              - { name: en, label: English, type: string }
          - name: pickedForYou
            label: Podpis katalogu
            type: object
            fields:
              - { name: pl, label: Polski, type: string }
              - { name: en, label: English, type: string }
          - name: favoriteBouquets
            label: Nagłówek katalogu
            type: object
            fields:
              - { name: pl, label: Polski, type: string }
              - { name: en, label: English, type: string }
          - name: freshDaily
            label: Tekst katalogu
            type: object
            fields:
              - { name: pl, label: Polski, type: string }
              - { name: en, label: English, type: string }
          - name: ourStudio
            label: Podpis sekcji O nas
            type: object
            fields:
              - { name: pl, label: Polski, type: string }
              - { name: en, label: English, type: string }
          - name: storyTitle
            label: Nagłówek O nas
            type: object
            fields:
              - { name: pl, label: Polski, type: string }
              - { name: en, label: English, type: string }
          - name: storyText
            label: Opis O nas
            type: object
            fields:
              - { name: pl, label: Polski, type: text }
              - { name: en, label: English, type: text }
          - name: meetGent
            label: Link O nas
            type: object
            fields:
              - { name: pl, label: Polski, type: string }
              - { name: en, label: English, type: string }
          - name: footerLine
            label: Tekst stopki
            type: object
            fields:
              - { name: pl, label: Polski, type: string }
              - { name: en, label: English, type: string }
          - name: hours
            label: Godziny otwarcia
            type: object
            fields:
              - { name: pl, label: Polski, type: string }
              - { name: en, label: English, type: string }
      - name: hero
        label: Główny ekran — obraz
        type: object
        fields:
          - { name: eyebrow, label: Mały podpis, type: string }
          - { name: image, label: Zdjęcie główne, type: image }
          - name: image_alt
            label: Opis zdjęcia PL / EN
            type: object
            fields:
              - { name: pl, label: Polski, type: string }
              - { name: en, label: English, type: string }
      - name: hero_button
        label: Główny przycisk
        type: object
        fields:
          - name: label
            label: Tekst przycisku PL / EN
            type: object
            fields:
              - { name: pl, label: Polski, type: string }
              - { name: en, label: English, type: string }
          - { name: url, label: Link przycisku, type: string }
      - name: navigation
        label: Menu nawigacji
        type: object
        list:
          min: 1
          collapsible: true
        fields:
          - name: label
            label: Nazwa PL / EN
            type: object
            fields:
              - { name: pl, label: Polski, type: string }
              - { name: en, label: English, type: string }
          - { name: url, label: Link, type: string }
      - name: collections
        label: Kolekcje kwiatów
        type: object
        list:
          min: 0
          collapsible: true
        fields:
          - name: title
            label: Nazwa PL / EN
            type: object
            fields:
              - { name: pl, label: Polski, type: string }
              - { name: en, label: English, type: string }
          - name: subtitle
            label: Podpis PL / EN
            type: object
            fields:
              - { name: pl, label: Polski, type: string }
              - { name: en, label: English, type: string }
          - { name: image, label: Zdjęcie kolekcji, type: image }
          - name: alt
            label: Opis zdjęcia PL / EN
            type: object
            fields:
              - { name: pl, label: Polski, type: string }
              - { name: en, label: English, type: string }
          - { name: url, label: Link, type: string }
      - name: products
        label: Bukiety — katalog produktów
        type: object
        list:
          min: 0
          collapsible: true
        fields:
          - name: name
            label: Nazwa PL / EN
            type: object
            fields:
              - { name: pl, label: Polski, type: string }
              - { name: en, label: English, type: string }
          - name: subtitle
            label: Krótki opis PL / EN
            type: object
            fields:
              - { name: pl, label: Polski, type: string }
              - { name: en, label: English, type: string }
          - name: description
            label: Pełny opis PL / EN
            type: object
            fields:
              - { name: pl, label: Polski, type: text }
              - { name: en, label: English, type: text }
          - { name: price, label: Cena, type: number }
          - { name: currency, label: Waluta, type: string }
          - { name: image, label: Zdjęcie bukietu, type: image }
          - name: alt
            label: Opis zdjęcia PL / EN
            type: object
            fields:
              - { name: pl, label: Polski, type: string }
              - { name: en, label: English, type: string }
          - name: badge
            label: Etykieta PL / EN
            type: object
            fields:
              - { name: pl, label: Polski, type: string }
              - { name: en, label: English, type: string }
          - name: palette
            label: Warianty kolorów
            type: object
            list:
              min: 0
              collapsible: true
            fields:
              - name: name
                label: Kolor PL / EN
                type: object
                fields:
                  - { name: pl, label: Polski, type: string }
                  - { name: en, label: English, type: string }
              - { name: hex, label: Kod koloru HEX, type: string }
              - { name: image, label: Zdjęcie dla tego koloru bukietu, type: image }
      - name: story
        label: Sekcja O nas — zdjęcie
        type: object
        fields:
          - { name: image, label: Zdjęcie, type: image }
          - name: alt
            label: Opis zdjęcia PL / EN
            type: object
            fields:
              - { name: pl, label: Polski, type: string }
              - { name: en, label: English, type: string }
          - { name: button_url, label: Link przycisku, type: string }
      - name: extra_blocks
        label: Dodatkowe bloki strony
        type: block
        list:
          collapsible: true
        blockKey: type
        blocks:
          - name: text
            label: Blok tekstowy
            fields:
              - name: title
                label: Nagłówek PL / EN
                type: object
                fields:
                  - { name: pl, label: Polski, type: string }
                  - { name: en, label: English, type: string }
              - name: body
                label: Tekst PL / EN
                type: object
                fields:
                  - { name: pl, label: Polski, type: text }
                  - { name: en, label: English, type: text }
          - name: image
            label: Blok ze zdjęciem
            fields:
              - name: title
                label: Nagłówek PL / EN
                type: object
                fields:
                  - { name: pl, label: Polski, type: string }
                  - { name: en, label: English, type: string }
              - name: image
                label: Zdjęcie
                type: image
              - name: alt
                label: Opis zdjęcia
                type: string
          - name: cta
            label: Blok z przyciskiem
            fields:
              - name: title
                label: Nagłówek PL / EN
                type: object
                fields:
                  - { name: pl, label: Polski, type: string }
                  - { name: en, label: English, type: string }
              - name: body
                label: Tekst PL / EN
                type: object
                fields:
                  - { name: pl, label: Polski, type: text }
                  - { name: en, label: English, type: text }
              - name: button
                label: Przycisk
                type: object
                fields:
                  - name: label
                    label: Tekst PL / EN
                    type: object
                    fields:
                      - { name: pl, label: Polski, type: string }
                      - { name: en, label: English, type: string }
                  - { name: url, label: Link, type: string }
