name = "gent-flowers-orders"
main = "index.js"
compatibility_date = "2026-11-10"

# Keep existing Worker variables and secrets in the Cloudflare dashboard.
# Create a D1 database and replace DATABASE_ID with its actual ID.
[[d1_databases]]
binding = "DB"
database_name = "gent-flowers-orders"
database_id = "REPLACE_WITH_DATABASE_ID"
